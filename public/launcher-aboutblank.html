<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nexus About:Blank Launcher</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0a0a0f; color: #fff; margin: 0; padding: 24px; }
    button { padding: 12px 16px; background: #00f0ff; color: #0a0a0f; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; }
    button:hover { filter: brightness(0.9); }
    .note { margin-top: 12px; color: #9ca3af; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Launch Nexus in about:blank</h1>
  <p>Opens an about:blank window and loads the app inside an embedded frame.</p>
  <button id="launch">Open about:blank</button>
  <div class="note">If your browser blocks popups, allow this site to open a new window.</div>

  <script>
    document.getElementById('launch').onclick = () => {
      const win = window.open('about:blank', '_blank');
      if (!win) {
        alert('Popup blocked. Please allow popups for this site.');
        return;
      }

      const doc = win.document;
      doc.open();
      doc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Nexus</title>
        <style>html,body,iframe{margin:0;padding:0;width:100%;height:100%;border:0;overflow:hidden;background:#000;}</style>
      </head><body>
        <iframe src="${location.origin}/index.html?embedded=true" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
      </body></html>`);
      doc.close();
    };
  </script>
</body>
</html>

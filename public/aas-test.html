<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAS - Thinking AI Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .status {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .status-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
        }

        .status-dot.warn {
            background: #fbbf24;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-radius: 12px 4px 12px 12px;
        }

        .message.ai .message-content {
            background: #f3f4f6;
            color: #1f2937;
            border-radius: 4px 12px 12px 12px;
        }

        .thinking {
            background: #fef3c7;
            border: 1px solid #fcd34d;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #92400e;
            max-width: 100%;
            overflow-x: auto;
        }

        .thinking summary {
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .thinking pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-top: 8px;
        }

        .metadata {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: #6b7280;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .badge {
            background: #e5e7eb;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .input-area {
            border-top: 1px solid #e5e7eb;
            padding: 16px 24px;
            background: #fafafa;
            display: flex;
            gap: 12px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 14px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .typing {
            display: flex;
            gap: 4px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: typing 1.4s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid #dc2626;
        }

        .suggestions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .suggestion-btn {
            padding: 8px 12px;
            background: #f3f4f6;
            color: #667eea;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .suggestion-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .emoji {
            font-size: 1.2em;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Thinking AI Test</h1>
            <p>Ask the AI anything. Watch it think in real-time.</p>
            <div class="status">
                <div class="status-item">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Connecting...</span>
                </div>
                <div class="status-item">
                    <span id="apiStatus">APIs: Checking...</span>
                </div>
            </div>
        </div>

        <div class="messages" id="messages">
            <div class="message ai">
                <div class="message-content">
                    <div style="margin-bottom: 12px;">👋 Hi! I'm your thinking AI. Ask me anything:</div>
                    <div class="suggestions">
                        <button class="suggestion-btn" onclick="sendMessage('How do I learn JavaScript efficiently?')">Learn JavaScript</button>
                        <button class="suggestion-btn" onclick="sendMessage('Should I ask for a raise?')">Career advice</button>
                        <button class="suggestion-btn" onclick="sendMessage('I have too much to do, what should I prioritize?')">Time management</button>
                        <button class="suggestion-btn" onclick="sendMessage('Help me debug this code')">Code help</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Ask me anything..."
                onkeypress="handleKeyPress(event)"
            >
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let sessionId = null;
        let isWaitingForResponse = false;

        // Initialize
        async function init() {
            try {
                // Check server health
                const healthRes = await fetch('/api/health');
                const health = await healthRes.json();
                
                updateStatus('Connected', true);
                updateAPIStatus(health.apis);

                // Start session
                const sessionRes = await fetch('/api/session/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        preferences: {
                            personality: 'mentor',
                            mentorship: 0.8,
                            showThinking: true
                        }
                    })
                });

                const sessionData = await sessionRes.json();
                sessionId = sessionData.sessionId;
                console.log('Session started:', sessionId);
            } catch (error) {
                console.error('Init error:', error);
                updateStatus('Connection Failed', false);
                showError('Failed to connect to AI server. Make sure it\'s running: node aas-server.js');
            }
        }

        function updateStatus(text, ok) {
            document.getElementById('statusText').textContent = text;
            const dot = document.getElementById('statusDot');
            dot.className = ok ? 'status-dot' : 'status-dot warn';
        }

        function updateAPIStatus(apis) {
            const hasGoogle = apis.google === 'configured';
            const dot = hasGoogle ? 'status-dot' : 'status-dot warn';
            document.getElementById('apiStatus').innerHTML = `
                <span class="${dot}" style="width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px;"></span>
                APIs: ${hasGoogle ? 'Ready' : 'Limited (local mode)'}
            `;
        }

        function showError(message) {
            const messagesDiv = document.getElementById('messages');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = '⚠️ ' + message;
            messagesDiv.appendChild(errorDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !isWaitingForResponse) {
                sendMessage();
            }
        }

        async function sendMessage(text = null) {
            if (isWaitingForResponse || !sessionId) return;

            const input = document.getElementById('messageInput');
            const message = text || input.value.trim();

            if (!message) return;

            input.value = '';
            isWaitingForResponse = true;
            document.getElementById('sendBtn').disabled = true;

            // Show user message
            displayMessage('user', message);

            try {
                // Send to AI
                const res = await fetch('/api/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId,
                        message
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    showError(data.error || 'Failed to get response');
                } else {
                    // Show AI response with thinking
                    displayMessage('ai', data.response, data.thinking, data.topics);
                }
            } catch (error) {
                console.error('Send error:', error);
                showError('Network error: ' + error.message);
            } finally {
                isWaitingForResponse = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('messageInput').focus();
            }
        }

        function displayMessage(role, content, thinking = null, topics = null) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + role;

            let html = `<div class="message-content">`;
            html += `<div>${escapeHtml(content)}</div>`;

            if (thinking) {
                html += `
                    <div class="thinking" style="margin-top: 12px;">
                        <details>
                            <summary>🧠 Show thinking process...</summary>
                            <pre>${escapeHtml(thinking)}</pre>
                        </details>
                    </div>
                `;
            }

            if (topics && topics.length > 0) {
                html += `
                    <div class="metadata">
                        <span>Topics: ${topics.map(t => `<span class="badge">${escapeHtml(t)}</span>`).join('')}</span>
                    </div>
                `;
            }

            html += `</div>`;
            messageDiv.innerHTML = html;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Start on load
        window.addEventListener('load', init);
    </script>
</body>
</html>

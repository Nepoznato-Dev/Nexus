<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- BitLife Icon - Life simulator -->
  <!-- Phone/app background -->
  <rect x="12" y="8" width="40" height="48" rx="4" fill="#4a90e2" stroke="#2c5aa0" stroke-width="2"/>
  
  <!-- App bar -->
  <rect x="12" y="8" width="40" height="8" fill="#2c5aa0"/>
  <text x="32" y="14" font-family="Arial, sans-serif" font-size="6" fill="#fff" text-anchor="middle" font-weight="bold">BitLife</text>
  
  <!-- Life stages icons -->
  <!-- Baby -->
  <circle cx="22" cy="26" r="4" fill="#ffcba4" stroke="#333" stroke-width="1"/>
  <path d="M 22 30 L 22 36" stroke="#333" stroke-width="2"/>
  <circle cx="21" cy="25" r="0.8" fill="#333"/>
  <circle cx="23" cy="25" r="0.8" fill="#333"/>
  <path d="M 21 27 Q 22 28, 23 27" stroke="#333" stroke-width="0.8" fill="none"/>
  
  <!-- Adult -->
  <circle cx="32" cy="26" r="4" fill="#ffcba4" stroke="#333" stroke-width="1"/>
  <path d="M 32 30 L 32 38 M 28 32 L 36 32" stroke="#333" stroke-width="2"/>
  <path d="M 32 38 L 29 44 M 32 38 L 35 44" stroke="#333" stroke-width="2"/>
  <circle cx="31" cy="25" r="0.8" fill="#333"/>
  <circle cx="33" cy="25" r="0.8" fill="#333"/>
  
  <!-- Elder -->
  <circle cx="42" cy="26" r="4" fill="#ffcba4" stroke="#333" stroke-width="1"/>
  <path d="M 42 30 L 42 36" stroke="#333" stroke-width="2"/>
  <line x1="39" y1="32" x2="45" y2="32" stroke="#333" stroke-width="2"/>
  <path d="M 42 36 L 44 38" stroke="#8b7355" stroke-width="2"/> <!-- cane -->
  <circle cx="41" cy="25" r="0.8" fill="#333"/>
  <circle cx="43" cy="25" r="0.8" fill="#333"/>
  <path d="M 40 23 Q 42 22, 44 23" stroke="#d4d4d4" stroke-width="1" fill="none"/> <!-- gray hair -->
  
  <!-- Stats/choices -->
  <rect x="16" y="42" width="32" height="3" rx="1.5" fill="#fff" opacity="0.3"/>
  <rect x="16" y="46" width="24" height="3" rx="1.5" fill="#fff" opacity="0.3"/>
  <rect x="16" y="50" width="28" height="3" rx="1.5" fill="#fff" opacity="0.3"/>
</svg>
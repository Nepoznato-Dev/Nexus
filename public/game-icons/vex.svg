<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Vex Icon - Stickman parkour -->
  <!-- Stickman character -->
  <circle cx="32" cy="16" r="5" fill="#000" stroke="#333" stroke-width="1.5"/>
  
  <!-- Body -->
  <line x1="32" y1="21" x2="32" y2="36" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Arms (dynamic pose) -->
  <path d="M 32 24 L 24 28" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 32 24 L 40 20" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Legs (running/jumping) -->
  <path d="M 32 36 L 26 44" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 32 36 L 38 46" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Platform -->
  <rect x="8" y="50" width="20" height="6" fill="#4A4A4A" stroke="#333" stroke-width="1.5"/>
  
  <!-- Spikes (danger) -->
  <path d="M 46 54 L 48 48 L 50 54 Z" fill="#FF0000" stroke="#CC0000" stroke-width="1"/>
  <path d="M 50 54 L 52 48 L 54 54 Z" fill="#FF0000" stroke="#CC0000" stroke-width="1"/>
  <path d="M 54 54 L 56 48 L 58 54 Z" fill="#FF0000" stroke="#CC0000" stroke-width="1"/>
  
  <!-- Wall to wall-jump off -->
  <rect x="54" y="8" width="6" height="40" fill="#666" stroke="#444" stroke-width="1.5"/>
  
  <!-- Speed/motion lines -->
  <line x1="38" y1="12" x2="44" y2="10" stroke="#00D4FF" stroke-width="2" opacity="0.6"/>
  <line x1="36" y1="16" x2="42" y2="14" stroke="#00D4FF" stroke-width="2" opacity="0.5"/>
  
  <!-- Act/Level indicator (iconic Vex element) -->
  <circle cx="14" cy="12" r="8" fill="#00D4FF" stroke="#00A0CC" stroke-width="2"/>
  <text x="14" y="16" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
</svg>
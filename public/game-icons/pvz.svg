<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Plants vs Zombies Icon -->
  <!-- Peashooter plant -->
  <ellipse cx="28" cy="48" r="8" ry="6" fill="#8b4513" stroke="#654321" stroke-width="2"/>
  
  <!-- Pot -->
  <path d="M 20 42 Q 20 38, 24 38 L 32 38 Q 36 38, 36 42 L 36 48 Q 36 52, 32 52 L 24 52 Q 20 52, 20 48 Z" fill="#d2691e" stroke="#8b4513" stroke-width="2"/>
  
  <!-- Plant stem -->
  <rect x="26" y="28" width="4" height="14" fill="#6aa84f" rx="2"/>
  
  <!-- Head -->
  <circle cx="28" cy="24" r="10" fill="#90ee90" stroke="#6aa84f" stroke-width="2"/>
  
  <!-- Mouth/shooter -->
  <ellipse cx="34" cy="24" r="5" ry="4" fill="#6aa84f" stroke="#4a7c3b" stroke-width="2"/>
  <circle cx="36" cy="24" r="2" fill="#2d5016"/>
  
  <!-- Eyes -->
  <ellipse cx="24" cy="22" rx="3" ry="4" fill="#fff" stroke="#333" stroke-width="1"/>
  <circle cx="24" cy="23" r="2" fill="#333"/>
  <ellipse cx="30" cy="22" rx="3" ry="4" fill="#fff" stroke="#333" stroke-width="1"/>
  <circle cx="30" cy="23" r="2" fill="#333"/>
  
  <!-- Pea projectile -->
  <circle cx="48" cy="24" r="4" fill="#90ee90" stroke="#6aa84f" stroke-width="1.5"/>
  <circle cx="47" cy="23" r="1" fill="#fff" opacity="0.7"/>
  
  <!-- Small leaves -->
  <ellipse cx="22" cy="30" rx="4" ry="6" fill="#6aa84f" transform="rotate(-30 22 30)"/>
  <ellipse cx="34" cy="30" rx="4" ry="6" fill="#6aa84f" transform="rotate(30 34 30)"/>
  
  <!-- Zombie hand reaching (iconic PvZ element) -->
  <path d="M 52 44 L 50 52" stroke="#8b9d6b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 52 44 L 54 52" stroke="#8b9d6b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 52 44 L 56 50" stroke="#8b9d6b" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="52" cy="42" rx="4" ry="3" fill="#9db57d"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Moto X3M Icon - Motorcycle stunt racing -->
  <!-- Ramp -->
  <path d="M 8 48 L 28 32 L 32 32 L 32 48 Z" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  
  <!-- Bike wheel (front) -->
  <circle cx="42" cy="44" r="8" fill="#333" stroke="#000" stroke-width="2"/>
  <circle cx="42" cy="44" r="6" fill="none" stroke="#666" stroke-width="1.5"/>
  <circle cx="42" cy="44" r="1.5" fill="#666"/>
  <line x1="38" y1="40" x2="46" y2="48" stroke="#666" stroke-width="1"/>
  <line x1="38" y1="48" x2="46" y2="40" stroke="#666" stroke-width="1"/>
  
  <!-- Bike wheel (back) -->
  <circle cx="22" cy="44" r="8" fill="#333" stroke="#000" stroke-width="2"/>
  <circle cx="22" cy="44" r="6" fill="none" stroke="#666" stroke-width="1.5"/>
  <circle cx="22" cy="44" r="1.5" fill="#666"/>
  <line x1="18" y1="40" x2="26" y2="48" stroke="#666" stroke-width="1"/>
  <line x1="18" y1="48" x2="26" y2="40" stroke="#666" stroke-width="1"/>
  
  <!-- Bike frame -->
  <path d="M 22 44 L 28 36 L 36 36 L 42 44" stroke="#ff0000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 28 36 L 32 44" stroke="#ff0000" stroke-width="2.5"/>
  <path d="M 36 36 L 38 42" stroke="#ff0000" stroke-width="2"/>
  
  <!-- Handlebars -->
  <path d="M 36 36 L 40 32" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Rider helmet -->
  <circle cx="30" cy="26" r="5" fill="#4169E1" stroke="#2c4a7c" stroke-width="2"/>
  <path d="M 28 26 L 34 26" stroke="#000" stroke-width="4" opacity="0.6"/>
  
  <!-- Rider body -->
  <ellipse cx="30" cy="34" rx="4" ry="6" fill="#333" stroke="#000" stroke-width="1.5"/>
  
  <!-- Arms -->
  <path d="M 28 32 L 36 36" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Legs -->
  <path d="M 30 38 L 28 44" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Speed lines -->
  <line x1="12" y1="18" x2="4" y2="18" stroke="#FF8C00" stroke-width="2" opacity="0.6"/>
  <line x1="14" y1="24" x2="6" y2="24" stroke="#FF8C00" stroke-width="2" opacity="0.5"/>
  <line x1="16" y1="30" x2="8" y2="30" stroke="#FF8C00" stroke-width="2" opacity="0.4"/>
  
  <!-- Star (stunt) -->
  <path d="M 52 16 L 54 22 L 60 22 L 55 26 L 57 32 L 52 28 L 47 32 L 49 26 L 44 22 L 50 22 Z" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
</svg>
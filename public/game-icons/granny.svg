<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Granny Icon - Horror/Older Woman Theme -->
  <!-- Face Circle -->
  <circle cx="32" cy="32" r="28" fill="#8b7d6b" stroke="#5a4a3f" stroke-width="2"/>
  
  <!-- Hair -->
  <path d="M 10 25 Q 8 15, 15 10 Q 25 5, 32 6 Q 40 5, 49 10 Q 56 15, 54 25" fill="#d4d4d4" stroke="#9a9a9a" stroke-width="1.5"/>
  
  <!-- Wrinkles -->
  <path d="M 18 28 Q 20 26, 22 28" stroke="#5a4a3f" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M 42 28 Q 44 26, 46 28" stroke="#5a4a3f" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M 20 35 Q 24 33, 28 35" stroke="#5a4a3f" stroke-width="1" fill="none" opacity="0.6"/>
  
  <!-- Eyes (menacing) -->
  <circle cx="22" cy="28" r="3" fill="#2d2d2d"/>
  <circle cx="42" cy="28" r="3" fill="#2d2d2d"/>
  <circle cx="21" cy="27" r="1" fill="#fff"/>
  <circle cx="41" cy="27" r="1" fill="#fff"/>
  
  <!-- Glasses -->
  <circle cx="22" cy="28" r="6" fill="none" stroke="#4a4a4a" stroke-width="2"/>
  <circle cx="42" cy="28" r="6" fill="none" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="28" y1="28" x2="36" y2="28" stroke="#4a4a4a" stroke-width="2"/>
  
  <!-- Nose -->
  <path d="M 32 32 L 32 38" stroke="#5a4a3f" stroke-width="1.5" fill="none"/>
  
  <!-- Mouth (sinister smile) -->
  <path d="M 22 42 Q 32 48, 42 42" stroke="#5a4a3f" stroke-width="2" fill="none"/>
  
  <!-- Walking Stick -->
  <rect x="48" y="30" width="3" height="25" fill="#6b4423" rx="1.5"/>
  <path d="M 49 30 Q 52 25, 51 32" fill="#8b6f47" stroke="#6b4423" stroke-width="1"/>
</svg>
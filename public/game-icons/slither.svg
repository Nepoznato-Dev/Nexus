<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Slither.io Icon - Snake game -->
  <!-- Snake body (coiled) -->
  <circle cx="32" cy="36" r="6" fill="#44ff44" stroke="#33cc33" stroke-width="2"/>
  <circle cx="26" cy="32" r="5" fill="#44ff44" stroke="#33cc33" stroke-width="2"/>
  <circle cx="22" cy="26" r="4.5" fill="#44ff44" stroke="#33cc33" stroke-width="2"/>
  <circle cx="20" cy="20" r="4" fill="#44ff44" stroke="#33cc33" stroke-width="2"/>
  <circle cx="38" cy="32" r="5" fill="#44ff44" stroke="#33cc33" stroke-width="2"/>
  <circle cx="42" cy="26" r="4.5" fill="#44ff44" stroke="#33cc33" stroke-width="2"/>
  <circle cx="44" cy="20" r="4" fill="#44ff44" stroke="#33cc33" stroke-width="2"/>
  <circle cx="32" cy="42" r="5.5" fill="#44ff44" stroke="#33cc33" stroke-width="2"/>
  
  <!-- Snake head -->
  <circle cx="32" cy="18" r="8" fill="#44ff44" stroke="#33cc33" stroke-width="2"/>
  
  <!-- Eyes -->
  <circle cx="28" cy="16" r="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="36" cy="16" r="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="28" cy="16" r="1.5" fill="#333"/>
  <circle cx="36" cy="16" r="1.5" fill="#333"/>
  
  <!-- Eye shine -->
  <circle cx="27" cy="15" r="0.8" fill="#fff"/>
  <circle cx="35" cy="15" r="0.8" fill="#fff"/>
  
  <!-- Mouth -->
  <path d="M 30 20 Q 32 22, 34 20" stroke="#333" stroke-width="1.5" fill="none"/>
  
  <!-- Tongue (snake) -->
  <path d="M 32 22 L 32 24 M 31 24 L 32 25 M 33 24 L 32 25" stroke="#ff0000" stroke-width="1" fill="none"/>
  
  <!-- Glowing orbs (food) -->
  <circle cx="12" cy="48" r="3" fill="#ffff00" opacity="0.8"/>
  <circle cx="12" cy="48" r="1.5" fill="#fff"/>
  
  <circle cx="52" cy="48" r="3" fill="#ff00ff" opacity="0.8"/>
  <circle cx="52" cy="48" r="1.5" fill="#fff"/>
  
  <circle cx="48" cy="10" r="2.5" fill="#00ffff" opacity="0.8"/>
  <circle cx="48" cy="10" r="1.2" fill="#fff"/>
  
  <circle cx="16" cy="12" r="2.5" fill="#ff8800" opacity="0.8"/>
  <circle cx="16" cy="12" r="1.2" fill="#fff"/>
  
  <!-- Border/arena feel -->
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#333" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>
</svg>
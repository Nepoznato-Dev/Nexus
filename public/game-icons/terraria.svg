<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Terraria Icon - Adventure/Mining/Building theme -->
  <!-- Sky background -->
  <rect x="0" y="0" width="64" height="32" fill="#87CEEB"/>
  
  <!-- Ground layers -->
  <rect x="0" y="32" width="64" height="8" fill="#8B7355"/>
  <rect x="0" y="40" width="64" height="8" fill="#6B5344"/>
  <rect x="0" y="48" width="64" height="16" fill="#4A4A4A"/>
  
  <!-- Grass -->
  <path d="M 0 32 L 4 30 L 8 32 L 12 30 L 16 32 L 20 30 L 24 32 L 28 30 L 32 32 L 36 30 L 40 32 L 44 30 L 48 32 L 52 30 L 56 32 L 60 30 L 64 32 L 64 34 L 0 34 Z" fill="#6B8E23"/>
  
  <!-- Tree -->
  <rect x="12" y="20" width="4" height="12" fill="#8B4513"/>
  <circle cx="14" cy="18" r="6" fill="#2F4F2F"/>
  <circle cx="11" cy="20" r="4" fill="#228B22"/>
  <circle cx="17" cy="20" r="4" fill="#228B22"/>
  
  <!-- Character (player with pickaxe) -->
  <circle cx="32" cy="26" r="3" fill="#FFD700" stroke="#333" stroke-width="1"/>
  <rect x="30" y="29" width="4" height="6" fill="#4169E1"/>
  <line x1="30" y1="31" x2="26" y2="33" stroke="#FFD700" stroke-width="2"/>
  <line x1="34" y1="31" x2="38" y2="33" stroke="#FFD700" stroke-width="2"/>
  <line x1="30" y1="35" x2="28" y2="40" stroke="#4169E1" stroke-width="2"/>
  <line x1="34" y1="35" x2="36" y2="40" stroke="#4169E1" stroke-width="2"/>
  
  <!-- Pickaxe -->
  <line x1="38" y1="33" x2="44" y2="28" stroke="#8B4513" stroke-width="2"/>
  <path d="M 43 27 L 46 26 L 47 29 Z" fill="#808080" stroke="#333" stroke-width="1"/>
  
  <!-- Ores/gems in ground -->
  <rect x="8" y="44" width="3" height="3" fill="#FFD700"/> <!-- gold -->
  <rect x="24" y="52" width="3" height="3" fill="#4169E1"/> <!-- sapphire -->
  <rect x="48" y="50" width="3" height="3" fill="#FF69B4"/> <!-- crystal -->
  <rect x="36" y="56" width="3" height="3" fill="#32CD32"/> <!-- emerald -->
  
  <!-- Sun -->
  <circle cx="52" cy="12" r="5" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
  
  <!-- Clouds -->
  <ellipse cx="18" cy="10" rx="6" ry="3" fill="#FFF" opacity="0.7"/>
  <ellipse cx="14" cy="11" rx="4" ry="2.5" fill="#FFF" opacity="0.7"/>
  <ellipse cx="22" cy="11" rx="4" ry="2.5" fill="#FFF" opacity="0.7"/>
</svg>
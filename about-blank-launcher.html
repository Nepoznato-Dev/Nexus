<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Nexus Launcher</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 20px;
      background: #0b0f17;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    
    .container {
      text-align: center;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.05);
      padding: 40px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    h1 {
      margin: 0 0 20px 0;
      font-size: 28px;
      font-weight: 700;
    }
    
    p {
      margin: 0 0 30px 0;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
    }
    
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      padding: 12px 32px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }
    
    button:hover {
      opacity: 0.9;
    }
    
    button:active {
      opacity: 0.8;
    }
    
    .error {
      color: #ff6b6b;
      font-size: 14px;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Nexus</h1>
    <p>Click below to launch Nexus in a secure about:blank environment.</p>
    <button id="launch">Launch in about:blank</button>
    <div class="error" id="error">Popups are blocked. Please allow popups and try again.</div>
  </div>

  <script>
    document.getElementById("launch").onclick = () => {
      const appUrl = window.location.origin + "/build/index.html";
      
      const w = window.open("about:blank", "_blank");
      if (!w) {
        document.getElementById("error").style.display = "block";
        return;
      }

      w.document.open();
      w.document.write(`<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexus</title>
  <style>
    html, body { margin: 0; height: 100%; width: 100%; }
    iframe { border: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <iframe src="${appUrl}" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-presentation"></iframe>
</body>
</html>`);
      w.document.close();
    };
  </script>
</body>
</html>
